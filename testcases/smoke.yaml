        size: 1024x1536

- id: TC-IP-003
  scene: IP创意图
  title: PenPen-九宫格表情包
  enabled: true
  provider: mock
  template: templates/02-IP创意图/IP表情包.md
  prompt: PenPen 企鹅，黑白配色圆胖小企鹅，橙色小嘴，头顶蓝毛；九宫格表情包，淡黄背景，每格一个表情：开心、生气、委屈、比心、加班、犯困、点赞、震惊、躺平，表情夸张，可配简短中文文字
