      params:
        size: 1024x1024

- id: TC-ERR-001
  scene: 异常用例
  title: 非法尺寸-模型不支持的参数（验证参数校验）
  enabled: true
  provider: mock
  template: templates/01-商品图/白底图.md
  prompt: 名创优品保温杯，纯白背景，商品居中，高清写实
  references: []
  params:
    model: gpt-image-1
    size: 2048x2048
    quality: high
  checkpoints:
    - 程序应在校验阶段拦截非法尺寸
    - 日志记录不支持的尺寸信息
    - 不实际调用生成接口
  rounds:
    - note: 第1轮预期失败，用于验证参数校验逻辑
      params:
        size: 2048x2048

- id: TC-VID-001
  scene: 视频
  title: 盲盒开箱短视频（Day6 启用）
  enabled: true
  provider: mock
  template: templates/03-视频分镜/开箱视频分镜.md
  prompt: 盲盒开箱短视频，8 个镜头：展示包裹、拆快递、展示包装盒、打开盒子、取出玩偶、惊喜展示、细节特写、摆回收纳架，轻松治愈
  references:
    - references/blindbox-reference.png
  params:
    model: seedance
    size: "9:16"
    duration: 40
  checkpoints:
    - 视频动作自然流畅
    - 盲盒角色与参考图一致
    - 镜头衔接无跳变
  rounds:
    - note: 第1轮待 Day6 执行
      params:
        size: "9:16"

